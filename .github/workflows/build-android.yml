name: Build Android APK

on:
  push:
    branches:
      - claude/setup-git-repo-464UR
      - main
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write  # 寫 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print versions (debug)
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug — 自動簽 dev key，能直接安裝)
        run: flutter build apk --debug

      - name: Rename APK with timestamp
        run: |
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-debug.apk \
             release_assets/yiwenlu-2347-latest.apk

      - name: Upload APK artifact (給開發者)
        uses: actions/upload-artifact@v4
        with:
          name: yiwenlu-2347-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Publish to Rolling Release (手機可直接下載)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "異聞錄·23:47 — 開發版 (滾動更新)"
          body: |
            ## 📱 最新開發版 APK

            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Build 時間**: 自動隨 push 更新

            ### 安裝步驟
            1. 點下方 `yiwenlu-2347-latest.apk` 直接下載
            2. 手機開「設定 → 安全性 → 未知來源安裝」
            3. 點 .apk 安裝

            ⚠️ 此為 debug 版本，僅供測試，不適合上架。
          prerelease: true
          make_latest: false
          files: release_assets/yiwenlu-2347-latest.apk
