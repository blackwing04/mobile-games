name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - claude/setup-git-repo-464UR
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web (release)
        # base-href 必須跟 GitHub Pages 路徑一致；repo 名稱為 mobile-games
        run: flutter build web --release --base-href "/mobile-games/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
