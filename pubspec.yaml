name: mobile_games
description: "Mobile Games — 模板化文字 TRPG 工廠"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# 等你 1024×1024 icon 來，跑 `dart run flutter_launcher_icons` 自動生成全平台尺寸
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false  # 等 iOS 平台資料夾建好後 (Mac 上 flutter create --platforms=ios) 再開 true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/scenarios/
    - assets/images/
    - assets/images/scenarios/demo_office/
    - assets/icons/
    - assets/audio/bgm/
    - assets/audio/sfx/
